<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subathon Overlay</title>
  <style>
    @font-face {
      font-family: "Block Script";
      src: url("assets/Block Script.otf") format("opentype");
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --timer-scale: 1;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      color: #ffffff;
      font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    .timer-stage {
      position: fixed;
      left: 50%;
      bottom: 36px;
      transform: translateX(-50%);
      z-index: 5;
      width: auto;
      pointer-events: none;
    }

    .timer-display {
      font-family: "Block Script", "Segoe UI", sans-serif;
      font-size: clamp(56px, calc(72px * var(--timer-scale)), 104px);
      line-height: 0.94;
      letter-spacing: 0.02em;
      text-align: center;
      color: #ffffff;
      text-shadow:
        0 0 18px rgba(0, 0, 0, 0.55);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .goal-shell {
      position: fixed;
      right: 36px;
      top: 5vh;
      z-index: 4;
      display: inline-flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 3px;
      max-width: min(460px, calc(100vw - 72px));
      text-align: right;
      pointer-events: none;
    }

    .goal-title {
      color: #ffffff;
      font-family: "Segoe UI", sans-serif;
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(0, 0, 0, 0.35);
    }

    .goal-row {
      display: inline-flex;
      align-items: baseline;
      justify-content: flex-end;
      gap: 10px;
      width: 100%;
    }

    .goal-count,
    .goal-goal,
    .goal-separator {
      font-family: "Block Script", "Segoe UI", sans-serif;
      font-weight: 400;
      line-height: 0.92;
      letter-spacing: 0.02em;
      text-shadow: 0 0 18px rgba(0, 0, 0, 0.55);
    }

    .goal-count,
    .goal-separator {
      color: #ffffff;
    }

    .goal-goal {
      color: #1baa7d;
    }

    .goal-count,
    .goal-goal {
      font-size: clamp(34px, 3vw, 52px);
    }

    .goal-separator {
      font-size: clamp(28px, 2.2vw, 42px);
    }

    .reward-text {
      color: #f6f8f7;
      font-family: "Segoe UI", sans-serif;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      max-width: 100%;
      text-align: right;
      text-shadow: 0 0 12px rgba(0, 0, 0, 0.35);
    }
  </style>
</head>
<body>
  <div class="goal-shell" aria-live="polite">
    <div id="goalTitle" class="goal-title">Subtember</div>
    <div class="goal-row">
      <span id="currentSubs" class="goal-count">0</span>
      <span class="goal-separator">/</span>
      <span id="goalCount" class="goal-goal">35</span>
    </div>
    <div id="rewardText" class="reward-text">Broforce w Chat</div>
  </div>

  <div class="timer-stage" aria-live="polite">
    <div id="timerDisplay" class="timer-display">06:00:00</div>
  </div>

  <script>
    const els = {
      timerDisplay: document.getElementById("timerDisplay"),
      goalTitle: document.getElementById("goalTitle"),
      currentSubs: document.getElementById("currentSubs"),
      goalCount: document.getElementById("goalCount"),
      rewardText: document.getElementById("rewardText")
    };

    function formatDuration(ms) {
      const negative = ms < 0;
      const totalSeconds = Math.floor(Math.abs(ms) / 1000);
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      const padded = [hours, minutes, seconds].map((value, index) => {
        if (index === 0 && hours > 99) {
          return String(value);
        }
        return String(value).padStart(2, "0");
      });
      return negative ? `-${padded.join(":")}` : padded.join(":");
    }

    function render(state) {
      document.documentElement.style.setProperty("--timer-scale", String(state.timerScale || 1));
      els.timerDisplay.textContent = formatDuration(state.remainingMs);
      els.goalTitle.textContent = state.subGoalTitle || "Subtember";
      els.currentSubs.textContent = String(state.currentSubs || 0);
      els.goalCount.textContent = String((state.activeMilestone && state.activeMilestone.goal) || 0);
      els.rewardText.textContent = (state.activeMilestone && state.activeMilestone.label) || "";
    }

    async function pollState() {
      try {
        const response = await fetch("/api/state", { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        render(await response.json());
      } catch (error) {
        console.warn("Failed to poll timer state.", error);
      }
    }

    pollState();
    window.setInterval(pollState, 250);
  </script>
</body>
</html>
